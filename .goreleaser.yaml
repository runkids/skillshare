version: 2

project_name: skillshare

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/skillshare
    binary: skillshare
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: skillshare-ui-dist.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: true
  use_existing_draft: true
  # Release Please fills the draft from its PR body; replace it with the reviewed CHANGELOG entry.
  mode: replace
  replace_existing_artifacts: true
  extra_files:
    - glob: skillshare-ui-dist.tar.gz

brews:
  - skip_upload: true
    repository:
      owner: runkids
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/runkids/skillshare
    description: Share skills across AI CLI tools
    license: MIT
    install: |
      bin.install "skillshare"
    test: |
      system "#{bin}/skillshare", "version"
